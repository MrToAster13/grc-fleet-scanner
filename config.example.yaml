# GRC Fleet Auditor — example configuration
# Copy to config.yaml and edit. Active scanning requires an explicit, AUTHORIZED scope.

# ---------------------------------------------------------------------------
# Scan scope (REQUIRED). The tool refuses to run with an empty cidrs list.
# ---------------------------------------------------------------------------
scope:
  cidrs:
    - 10.0.10.0/24          # the network(s) you are authorized to scan
    - 10.0.20.0/24
  exclude:
    - 10.0.10.1             # e.g. the gateway, sensitive appliances
  nmap_timing: "-T3"        # cautious by default; -T4 is faster/noisier
  nmap_extra_args: []       # appended verbatim to the nmap command
  ssh_concurrency: 10       # bounded parallel SSH/scan workers
  host_timeout_seconds: 600 # per-host scan timeout

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
output_dir: "./grc-output"  # history.db + per-run reports/evidence live here
cis_level: 1                # 1 = baseline (default), 2 = stricter
ssg_dir: "/usr/share/xml/scap/ssg/content"   # where SSG content lives on targets
low_confidence_threshold: 90   # flag a host's score LOW CONFIDENCE when fewer than
                               # this % of the benchmark actually produced a verdict
                               # (catches low-privilege scans where most checks didn't run)
# treat_unknown_linux_as_ubuntu: false  # default false. If true, hosts that look like
                               # some non-specific Linux (no Ubuntu marker, but not clearly
                               # non-Linux) are probed as Ubuntu *candidates*; the SSH detect
                               # stage stays authoritative and reclassifies any that are not.
# fetch_remote_resources: false # default false. If true, oscap is run with
                               # --fetch-remote-resources so checks whose OVAL/CVE content
                               # lives off-box are evaluated (higher coverage/confidence)
                               # instead of returning notchecked. Aggressive: the TARGET host
                               # reaches out to the network mid-scan. The `--deep` CLI flag
                               # forces this on (along with CIS L2 + -T4 discovery).
# os_detect: false            # default false. nmap -O OS detection; feeds the classify Ubuntu
                               # hint, so it is part of config_hash. Also set by --os-detect/--deep.
# known_hosts: "~/.ssh/known_hosts"          # omit to use system + user known_hosts

# ---------------------------------------------------------------------------
# Credential groups: map host ranges to an SSH identity + privilege.
# First matching group (top-down) wins. Use targets: ["default"] as a catch-all.
# ---------------------------------------------------------------------------
credential_groups:
  - name: prod-servers
    targets:
      - 10.0.10.0/24
    ssh_user: grc-scan
    key_path: "~/.ssh/grc_scan_ed25519"   # omit to rely purely on ssh-agent
    use_agent: true
    sudo: true                             # uses passwordless `sudo -n` for root checks
    cis_level: 2                           # per-group override of the global level
    bastion:
      host: bastion.example.com
      user: jump
      key_path: "~/.ssh/bastion_ed25519"

  - name: lab
    targets: ["default"]                   # everything not matched above
    ssh_user: ubuntu
    use_agent: true
    sudo: true
